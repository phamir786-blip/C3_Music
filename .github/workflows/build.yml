name: Build Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PLATFORMIO_VERSION: "6.1.18"
  BUILD_ENV: c3music
  ARTIFACT_NAME: c3music-firmware

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${{ env.PLATFORMIO_VERSION }}"

      - name: Restore PlatformIO cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'src/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build firmware
        run: |
          pio run -e ${{ env.BUILD_ENV }}

      - name: Inspect build outputs
        id: build_info
        run: |
          set -e
          BUILD_DIR=".pio/build/${{ env.BUILD_ENV }}"

          if [ ! -f "$BUILD_DIR/firmware.bin" ]; then
            echo "::error::firmware.bin not found in $BUILD_DIR"
            exit 1
          fi

          FIRMWARE_SIZE=$(stat -c%s "$BUILD_DIR/firmware.bin" 2>/dev/null || stat -f%z "$BUILD_DIR/firmware.bin")
          echo "firmware_size=$FIRMWARE_SIZE" >> "$GITHUB_OUTPUT"

          if [ -f "$BUILD_DIR/firmware.elf" ]; then
            ELF_SIZE=$(stat -c%s "$BUILD_DIR/firmware.elf" 2>/dev/null || stat -f%z "$BUILD_DIR/firmware.elf")
          else
            ELF_SIZE=0
          fi
          echo "elf_size=$ELF_SIZE" >> "$GITHUB_OUTPUT"

          if [ -f "$BUILD_DIR/bootloader.bin" ]; then
            echo "has_bootloader=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_bootloader=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "$BUILD_DIR/partitions.bin" ]; then
            echo "has_partitions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_partitions=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "$BUILD_DIR/boot_app0.bin" ]; then
            echo "has_bootapp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_bootapp=false" >> "$GITHUB_OUTPUT"
          fi

          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare artifact directory
        run: |
          mkdir -p artifact
          BUILD_DIR="${{ steps.build_info.outputs.build_dir }}"

          cp "$BUILD_DIR/firmware.bin" artifact/
          if [ "${{ steps.build_info.outputs.has_bootloader }}" = "true" ]; then
            cp "$BUILD_DIR/bootloader.bin" artifact/
          fi
          if [ "${{ steps.build_info.outputs.has_partitions }}" = "true" ]; then
            cp "$BUILD_DIR/partitions.bin" artifact/
          fi
          if [ "${{ steps.build_info.outputs.has_bootapp }}" = "true" ]; then
            cp "$BUILD_DIR/boot_app0.bin" artifact/
          fi
          if [ -f "$BUILD_DIR/firmware.elf" ]; then
            cp "$BUILD_DIR/firmware.elf" artifact/
          fi

      - name: Generate merged.bin
        run: |
          set -e
          BUILD_DIR="${{ steps.build_info.outputs.build_dir }}"
          ARTIFACT_DIR="artifact"

          if [ "${{ steps.build_info.outputs.has_bootloader }}" != "true" ] || \
             [ "${{ steps.build_info.outputs.has_partitions }}" != "true" ]; then
            echo "::warning::Missing bootloader or partitions; skipping merged.bin"
            exit 0
          fi

          MERGE_ARGS=(
            --output "$ARTIFACT_DIR/merged.bin"
            --flash_mode dio
            --flash_freq 80m
            --flash_size 4MB
            0x0000 "$BUILD_DIR/bootloader.bin"
            0x8000 "$BUILD_DIR/partitions.bin"
            0x10000 "$BUILD_DIR/firmware.bin"
          )

          python -m pip install "esptool==4.5.1"
          esptool.py --chip esp32c3 merge_bin "${MERGE_ARGS[@]}"

          if [ ! -f "$ARTIFACT_DIR/merged.bin" ]; then
            echo "::error::merged.bin was not created"
            exit 1
          fi

          MERGED_SIZE=$(stat -c%s "$ARTIFACT_DIR/merged.bin" 2>/dev/null || stat -f%z "$ARTIFACT_DIR/merged.bin")
          echo "Merged image size: $MERGED_SIZE bytes"

      - name: Write build-info.txt
        run: |
          set -e
          BUILD_DIR="${{ steps.build_info.outputs.build_dir }}"
          ARTIFACT_DIR="artifact"

          {
            echo "Device: C3 Music Receiver"
            echo "Firmware version: 1.3.1-HQ"
            echo "Build environment: ${{ env.BUILD_ENV }}"
            echo "PlatformIO version: ${{ env.PLATFORMIO_VERSION }}"
            echo "Python version: ${{ env.PYTHON_VERSION }}"
            echo "Runner: ${{ runner.os }} / ${{ runner.arch }}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo "Ref: ${GITHUB_REF:-unknown}"
            echo "Build time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo ""
            echo "Firmware size: ${{ steps.build_info.outputs.firmware_size }} bytes"
            echo "ELF size: ${{ steps.build_info.outputs.elf_size }} bytes"
            echo "Has bootloader: ${{ steps.build_info.outputs.has_bootloader }}"
            echo "Has partitions: ${{ steps.build_info.outputs.has_partitions }}"
            echo "Has boot_app0: ${{ steps.build_info.outputs.has_bootapp }}"
          } > "$ARTIFACT_DIR/build-info.txt"

          cat "$ARTIFACT_DIR/build-info.txt"

      - name: Create all-binaries ZIP archive
        run: |
          set -e
          cd artifact
          sudo apt-get update -qq && sudo apt-get install -y zip -qq
          zip -9 c3music-all-binaries.zip *.bin *.txt
          echo "Generated ZIP size: $(stat -c%s c3music-all-binaries.zip 2>/dev/null || stat -f%z c3music-all-binaries.zip) bytes"

      - name: Generate checksums
        run: |
          set -e
          cd artifact
          sha256sum *.bin *.elf *.zip > checksums.txt 2>/dev/null || \
            shasum -a 256 *.bin *.elf *.zip > checksums.txt
          cat checksums.txt

      - name: Upload standalone firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: artifact/firmware.bin
          retention-days: 14
          if-no-files-found: error

      - name: Upload all binaries package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated firmware build for C3 Music Receiver.

            ## Files

            - `firmware.bin` — single application binary for instant Web OTA update
            - `c3music-all-binaries.zip` — all binaries packaged in a single zip archive
            - `merged.bin` — full flash image for first USB flash via esptool
            - `bootloader.bin`, `partitions.bin`, `boot_app0.bin` — individual component binaries
            - `firmware.elf` — debug symbols
            - `checksums.txt` — SHA-256 checksums
            - `build-info.txt` — build metadata

            ## Quick Update
            - Upload `firmware.bin` directly on `http://c3music.local/` under **Settings ➔ Firmware OTA**.
          draft: false
          prerelease: false
          files: |
            artifact/firmware.bin
            artifact/c3music-all-binaries.zip
            artifact/merged.bin
            artifact/bootloader.bin
            artifact/partitions.bin
            artifact/boot_app0.bin
            artifact/firmware.elf
            artifact/checksums.txt
            artifact/build-info.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

; =============================================================================
; C3 Music Receiver
; ESP32-C3 + embedded SSD1306 72x40 OLED + UDA1334A I2S DAC
; =============================================================================

[platformio]
default_envs = c3music

[env:c3music]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Upload settings for initial USB flashing.
; OTA updates will be performed through the web app after first flash.
upload_speed = 921600

; Keeps the firmware optimized while preserving useful debug information.
build_type = release
build_unflags =
    -Os
build_flags =
    -O2
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096

; The only external library required.
; WiFi, WebServer, ESPmDNS, Preferences, Update, and I2S come with Arduino-ESP32.
lib_deps =
    olikraus/U8g2@^2.36.5

; LDF mode avoids accidental library matching problems in a large one-file project.
lib_ldf_mode = chain+

; Extra safety for a firmware that includes streaming, web UI, OTA, and OLED.
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; OTA requires two firmware slots. Leave this disabled until the exact flash
; capacity of the C3 board is confirmed; main.cpp will compile either way.
; When confirmed as an 8 MB module, enable this:
; board_build.partitions = default_8MB.csv
